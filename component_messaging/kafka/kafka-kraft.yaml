---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: kafka

---
# Persistent volume claim for Kafka data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ConfigMap — KRaft server.properties
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
data:
  server.properties: |
    # KRaft mode — no ZooKeeper
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093

    # Listeners
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
    advertised.listeners=PLAINTEXT://kafka-service.kafka.svc.cluster.local:9092,EXTERNAL://localhost:30092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER

    # Storage
    log.dirs=/var/kafka-data/kraft-logs

    # Topic defaults — suitable for single-node exploration
    num.partitions=3
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1

    # Retention
    log.retention.hours=24
    log.segment.bytes=536870912

---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka-service
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092   # internal PLAINTEXT
            - containerPort: 9093   # controller
            - containerPort: 9094   # external NodePort
          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"   # base64 16-byte UUID — fixed for reproducibility
          command:
            - /bin/bash
            - -c
            - |
              # Format storage on first run
              if [ ! -f /var/kafka-data/kraft-logs/meta.properties ]; then
                echo "Formatting Kafka storage..."
                /opt/kafka/bin/kafka-storage.sh format \
                  -t $CLUSTER_ID \
                  -c /etc/kafka/server.properties
              fi
              # Start broker
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka-data
            - name: kafka-config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-pvc
        - name: kafka-config
          configMap:
            name: kafka-config

---
# Headless service for internal cluster communication
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
# NodePort service — exposes Kafka externally on port 30092
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30092